<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra Colaborativa ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fce4ec;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #d81b60;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        .toolbar {
            background: white;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            z-index: 10;
        }
        .toolbar button, .toolbar input, .toolbar select {
            padding: 8px 12px;
            border: 2px solid #f8bbd0;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-weight: bold;
            color: #ad1457;
            outline: none;
            transition: 0.2s;
        }
        .toolbar button:hover, .toolbar button.active {
            background: #f8bbd0;
            color: #880e4f;
        }
        .canvas-container {
            position: relative;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        /* Estilo para los cursores flotantes de otros usuarios y Kuromi */
        .remote-cursor {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear;
            z-index: 100;
        }
        .user-tag {
            font-size: 10px;
            background: rgba(216, 27, 96, 0.8);
            color: white;
            padding: 2px 5px;
            border-radius: 4px;
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <h1>Pizarra Colaborativa ❤️</h1>

    <div class="toolbar">
        <label>Color: <input type="color" id="colorPicker" value="#000000"></label>
        <label>Grosor: <input type="range" id="brushSize" min="1" max="50" value="5"></label>
        <button id="btnPen" class="active">Lápiz</button>
        <button id="btnEraser">Borrador (Kuromi)</button>
        <button id="btnClear">Limpiar Todo</button>
    </div>

    <div class="canvas-container" id="canvasContainer">
        <canvas id="whiteboard"></canvas>
    </div>

    <!-- Cargar Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); // Se conecta automáticamente al servidor actual (Render o Local)

        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const sizePicker = document.getElementById('brushSize');
        const btnPen = document.getElementById('btnPen');
        const btnEraser = document.getElementById('btnEraser');
        const btnClear = document.getElementById('btnClear');
        const canvasContainer = document.getElementById('canvasContainer');

        // Ajustar tamaño del canvas
        canvas.width = 800;
        canvas.height = 500;

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentTool = 'pen'; // 'pen' o 'eraser'

        // Pedir nombre de usuario al entrar
        let userName = prompt("¿Cómo te llamas?") || "Anónimo";
        socket.emit('setName', userName);

        // Cambiar herramientas
        btnPen.addEventListener('click', () => {
            currentTool = 'pen';
            btnPen.classList.add('active');
            btnEraser.classList.remove('active');
            canvas.style.cursor = 'crosshair';
        });

        btnEraser.addEventListener('click', () => {
            currentTool = 'eraser';
            btnEraser.classList.add('active');
            btnPen.classList.remove('active');
            canvas.style.cursor = 'url("kuromi.png") 16 16, auto'; // Muestra a Kuromi como cursor propio si está en la carpeta public
        });

        // Eventos del Mouse para Dibujar
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            // Enviar posición del cursor a los demás (con indicador si usa borrador)
            socket.emit('cursorMove', {
                xPercent: currentX / canvas.width,
                yPercent: currentY / canvas.height,
                isEraser: (currentTool === 'eraser'),
                name: userName
            });

            if (!isDrawing) return;

            const color = currentTool === 'eraser' ? '#FFFFFF' : colorPicker.value;
            const size = currentTool === 'eraser' ? brushSize.value * 3 : sizePicker.value;

            // Dibujar localmente al instante
            drawLine(lastX, lastY, currentX, currentY, color, size);

            // Enviar trazo al servidor para que aparezca rápido en los demás
            socket.emit('draw', {
                x0: lastX,
                y0: lastY,
                x1: currentX,
                y1: currentY,
                color: color,
                size: size
            });

            lastX = currentX;
            lastY = currentY;
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        // Función para pintar líneas en el canvas
        function drawLine(x0, y0, x1, y1, color, size) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.strokeStyle = color;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.closePath();
        }

        // --- ESCUCHAR EVENTOS DEL SERVIDOR ---

        // Recibir historial al conectarse
        socket.emit('initHistory', []);
        socket.on('initHistory', (history) => {
            history.forEach(data => {
                drawLine(data.x0, data.y0, data.x1, data.y1, data.color, data.size);
            });
        });

        // Recibir trazos de otros usuarios en tiempo real
        socket.on('draw', (data) => {
            drawLine(data.x0, data.y0, data.x1, data.y1, data.color, data.size);
        });

        // Limpiar pizarra
        btnClear.addEventListener('click', () => {
            socket.emit('clear');
        });

        socket.on('clear', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Movimiento de cursores de otros usuarios y aparición de Kuromi
        socket.on('cursorMove', (data) => {
            let cursorEl = document.getElementById(`cursor-${data.id}`);
            if (!cursorEl) {
                cursorEl = document.createElement('div');
                cursorEl.id = `cursor-${data.id}`;
                cursorEl.className = 'remote-cursor';
                document.body.appendChild(cursorEl);
            }

            const rect = canvas.getBoundingClientRect();
            cursorEl.style.left = `${rect.left + (data.xPercent * canvas.width)}px`;
            cursorEl.style.top = `${rect.top + (data.yPercent * canvas.height)}px`;

            // Si el otro usuario usa el borrador, se muestra la imagen de Kuromi. Si no, un puntito rojo con su nombre.
            if (data.isEraser) {
                cursorEl.innerHTML = `
                    <div class="user-tag">${data.name} (Borrador)</div>
                    <img src="kuromi.png" width="35" style="pointer-events: none;" />
                `;
            } else {
                cursorEl.innerHTML = `
                    <div class="user-tag">${data.name}</div>
                    <div style="width: 8px; height: 8px; background: #ff4081; border-radius: 50%;"></div>
                `;
            }
        });

        // Eliminar cursor cuando alguien se desconecta
        socket.on('removeCursor', (id) => {
            const cursorEl = document.getElementById(`cursor-${id}`);
            if (cursorEl) cursorEl.remove();
        });
    </script>
</body>
</html>
