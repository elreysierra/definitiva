<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola tamo yetsa ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fceef3;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        #nameScreen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            background: url('miamor.jpeg') no-repeat center center / cover;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .nameBox {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 30px 20px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 85%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nameBox h2 {
            color: #d6336c;
            margin: 0 0 10px 0;
        }

        .nameBox p {
            margin-top: 0;
            color: #444;
        }

        #nameInput {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }

        #enterButton {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 20px;
            background: #d6336c;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        #app {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #d6336c;
            margin: 20px 0 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 10px;
        }

        #users {
            margin-bottom: 15px;
            color: #555;
            font-size: 14px;
        }

        .toolbar {
            width: 90vw;
            max-width: 1000px;
            background: white;
            padding: 12px 16px;
            border-radius: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .toolbar span {
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        .color-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .color {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #ddd;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .color:hover {
            transform: scale(1.15);
        }

        .color-picker {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: 2px solid #ddd;
            border-radius: 50%;
        }

        .tool-button {
            border: none;
            padding: 8px 13px;
            border-radius: 10px;
            background: #f3f3f3;
            cursor: pointer;
            font-size: 14px;
        }

        #size {
            width: 90px;
            cursor: pointer;
        }

        #canvas {
            background: white;
            border: 3px solid #d6336c;
            border-radius: 15px;
            width: 90vw;
            max-width: 1000px;
            height: auto;
            aspect-ratio: 1000 / 600;
            cursor: crosshair;
            touch-action: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        #clear {
            margin: 15px 0 25px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #d6336c;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        #currentColor {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid #555;
        }

        body.dark-mode {
            background: #181825;
            color: #cdd6f4;
        }

        body.dark-mode .nameBox {
            background: rgba(24, 24, 37, 0.88);
        }

        body.dark-mode .toolbar {
            background: #1e1e2e;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
        }

        body.dark-mode h1,
        body.dark-mode .nameBox h2 {
            color: #f5c2e7;
        }

        body.dark-mode .subtitle,
        body.dark-mode #users,
        body.dark-mode .toolbar span,
        body.dark-mode .nameBox p {
            color: #a6adc8;
        }

        body.dark-mode .tool-button {
            background: #313244;
            color: #cdd6f4;
        }

        body.dark-mode #nameInput {
            background: #181825;
            color: #cdd6f4;
            border-color: #45475a;
        }

        #kuromiCursor {
            position: fixed;
            pointer-events: none;
            display: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
        }

        #remoteKuromi {
            position: fixed;
            pointer-events: none;
            display: none;
            z-index: 999;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
        }
    </style>
</head>

<body>

<img id="kuromiCursor" src="./kuromi.png" alt="Kuromi Cursor">
<img id="remoteKuromi" src="./kuromi.png" alt="Remote Kuromi">

<div id="nameScreen">
    <div class="nameBox">
        <h2>Hola tamo yetsa ❤️</h2>
        <p>¿Quién está entrando?</p>
        <input id="nameInput" type="text" placeholder="Escribe tu nombre" maxlength="20">
        <button id="enterButton">Entrar ❤️</button>
    </div>
</div>

<div id="app">
    <h1>Hola tamo yetsa ❤️</h1>
    <div class="subtitle">Dibujen juntos ✨</div>
    <div id="users">🟢 Conectando...</div>

    <div class="toolbar">
        <span>🎨 Paleta:</span>
        <div class="color-palette">
            <button class="color" style="background:#000000" data-color="#000000" title="Negro"></button>
            <button class="color" style="background:#6c757d" data-color="#6c757d" title="Gris"></button>
            <button class="color" style="background:#ffffff" data-color="#ffffff" title="Blanco"></button>
            <button class="color" style="background:#e63946" data-color="#e63946" title="Rojo"></button>
            <button class="color" style="background:#ff69b4" data-color="#ff69b4" title="Rosado"></button>
            <button class="color" style="background:#ffb6c1" data-color="#ffb6c1" title="Rosado Pastel"></button>
            <button class="color" style="background:#ff7b00" data-color="#ff7b00" title="Naranja"></button>
            <button class="color" style="background:#ffd700" data-color="#ffd700" title="Amarillo"></button>
            <button class="color" style="background:#ffea00" data-color="#ffea00" title="Amarillo Claro"></button>
            <button class="color" style="background:#00a651" data-color="#00a651" title="Verde"></button>
            <button class="color" style="background:#2ec4b6" data-color="#2ec4b6" title="Turquesa"></button>
            <button class="color" style="background:#00b4d8" data-color="#00b4d8" title="Celeste"></button>
            <button class="color" style="background:#0066ff" data-color="#0066ff" title="Azul"></button>
            <button class="color" style="background:#8000ff" data-color="#8000ff" title="Púrpura"></button>
            <button class="color" style="background:#f72585" data-color="#f72585" title="Magenta"></button>
            <button class="color" style="background:#7f4f24" data-color="#7f4f24" title="Marrón"></button>
        </div>

        <span>Más:</span>
        <input type="color" id="customColor" class="color-picker" value="#000000" title="Elegir otro color">

        <span>Actual:</span>
        <div id="currentColor"></div>

        <span>🖌️ Tamaño:</span>
        <input type="range" id="size" min="1" max="40" value="5">
        <span id="sizeValue">5</span>

        <button class="tool-button" id="pencil">✏️ Lápiz</button>
        <button class="tool-button" id="eraser">🖤 Kuromi Borrador</button>
        <button class="tool-button" id="bucket">🪣 Balde</button>
        <button class="tool-button" id="themeToggle" title="Cambiar tema">🌙</button>
    </div>

    <canvas id="canvas" width="1000" height="600"></canvas>

    <button id="clear">🗑️ Limpiar lienzo</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const nameScreen = document.getElementById("nameScreen");
    const app = document.getElementById("app");
    const nameInput = document.getElementById("nameInput");
    const enterButton = document.getElementById("enterButton");
    const usersDisplay = document.getElementById("users");
    const sizeInput = document.getElementById("size");
    const sizeValue = document.getElementById("sizeValue");
    const currentColor = document.getElementById("currentColor");
    const customColor = document.getElementById("customColor");
    const themeToggle = document.getElementById("themeToggle");
    const kuromiCursor = document.getElementById("kuromiCursor");

    let drawing = false;
    let color = "#000000";
    let brushSize = 5;
    let lastX = 0;
    let lastY = 0;
    let currentTool = "pencil";
    let localHistory = [];

    let pendingDraws = [];
    let isBatchScheduled = false;

    currentColor.style.background = color;

    themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        themeToggle.textContent = isDark ? "☀️" : "🌙";
    });

    enterButton.addEventListener("click", enter);
    nameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") enter();
    });

    function enter() {
        const name = nameInput.value.trim();
        if (!name) {
            alert("Escribe tu nombre ❤️");
            return;
        }
        
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        socket.emit("setName", name);
        nameScreen.style.display = "none";
        app.style.display = "flex";
        redrawAll();
    }

    function getPosition(event) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: Math.floor((event.clientX - rect.left) * (canvas.width / rect.width)),
            y: Math.floor((event.clientY - rect.top) * (canvas.height / rect.height))
        };
    }

    function redrawAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        localHistory.forEach(data => {
            if (data.type === "fill") {
                floodFill(data.x, data.y, data.color);
            } else {
                drawLine(data.fromX, data.fromY, data.toX, data.toY, data.color, data.size);
            }
        });
    }

    document.querySelectorAll(".color").forEach(button => {
        button.addEventListener("click", () => {
            color = button.dataset.color;
            currentColor.style.background = color;
            customColor.value = color;
            if (currentTool === "eraser") currentTool = "pencil";
            canvas.style.cursor = "crosshair";
            kuromiCursor.style.display = "none";
        });
    });

    customColor.addEventListener("input", (e) => {
        color = e.target.value;
        currentColor.style.background = color;
        if (currentTool === "eraser") currentTool = "pencil";
        canvas.style.cursor = "crosshair";
        kuromiCursor.style.display = "none";
    });

    sizeInput.addEventListener("input", () => {
        brushSize = Number(sizeInput.value);
        sizeValue.textContent = brushSize;
        if (currentTool === "eraser") {
            const dynamicSize = Math.max(brushSize * 3, 20);
            kuromiCursor.style.width = `${dynamicSize}px`;
            kuromiCursor.style.height = `${dynamicSize}px`;
        }
    });

    document.getElementById("eraser").addEventListener("click", () => {
        currentTool = "eraser";
        currentColor.style.background = "#ffffff";
        canvas.style.cursor = "none";
        const dynamicSize = Math.max(brushSize * 3, 20);
        kuromiCursor.style.width = `${dynamicSize}px`;
        kuromiCursor.style.height = `${dynamicSize}px`;
        kuromiCursor.style.display = "block";
    });

    document.getElementById("pencil").addEventListener("click", () => {
        color = customColor.value;
        currentColor.style.background = color;
        currentTool = "pencil";
        canvas.style.cursor = "crosshair";
        kuromiCursor.style.display = "none";
    });

    document.getElementById("bucket").addEventListener("click", () => {
        currentTool = "bucket";
        canvas.style.cursor = "default";
        kuromiCursor.style.display = "none";
    });

    document.addEventListener("mouseleave", () => {
        kuromiCursor.style.display = "none";
    });

    canvas.addEventListener("pointerenter", () => {
        if (currentTool === "eraser") kuromiCursor.style.display = "block";
    });

    canvas.addEventListener("click", (e) => {
        if (currentTool === "bucket") {
            const pos = getPosition(e);
            floodFill(pos.x, pos.y, color);
            const data = { type: "fill", x: pos.x, y: pos.y, color: color };
            localHistory.push(data); // Sin límites
            socket.emit("fill", data);
        }
    });

    canvas.addEventListener("pointerdown", event => {
        if (currentTool === "bucket") return;
        event.preventDefault();
        drawing = true;
        const pos = getPosition(event);
        lastX = pos.x;
        lastY = pos.y;
    });

    canvas.addEventListener("pointermove", event => {
        const clientX = event.clientX;
        const clientY = event.clientY;

        if (currentTool === "eraser") {
            const dynamicSize = Math.max(brushSize * 3, 20);
            kuromiCursor.style.left = `${clientX}px`;
            kuromiCursor.style.top = `${clientY}px`;
        }

        if (!drawing || currentTool === "bucket") return;
        event.preventDefault();
        const pos = getPosition(event);

        const strokeColor = (currentTool === "eraser") ? "#ffffff" : color;
        const strokeSize = (currentTool === "eraser") ? Math.max(brushSize * 3, 15) : brushSize;

        drawLine(lastX, lastY, pos.x, pos.y, strokeColor, strokeSize);
        
        const drawData = {
            type: "draw",
            fromX: lastX,
            fromY: lastY,
            toX: pos.x,
            toY: pos.y,
            color: strokeColor,
            size: strokeSize
        };
        
        localHistory.push(data = drawData); // Sin límites

        pendingDraws.push(drawData);
        if (!isBatchScheduled) {
            isBatchScheduled = true;
            requestAnimationFrame(() => {
                if (pendingDraws.length > 0) {
                    socket.emit("drawBatch", pendingDraws);
                    pendingDraws = [];
                }
                isBatchScheduled = false;
            });
        }

        lastX = pos.x;
        lastY = pos.y;
    });

    canvas.addEventListener("pointerup", () => drawing = false);
    canvas.addEventListener("pointerleave", () => {
        drawing = false;
        kuromiCursor.style.display = "none";
    });

    function drawLine(fromX, fromY, toX, toY, color, size) {
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
        ctx.closePath();
    }

    function floodFill(startX, startY, hexColor) {
        startX = Math.floor(startX);
        startY = Math.floor(startY);
        if (startX < 0 || startX >= canvas.width || startY < 0 || startY >= canvas.height) return;

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        const r = parseInt(hexColor.slice(1, 3), 16);
        const g = parseInt(hexColor.slice(3, 5), 16);
        const b = parseInt(hexColor.slice(5, 7), 16);
        const fillColor = [r, g, b, 255];

        const startPos = (startY * canvas.width + startX) * 4;
        const targetColor = [data[startPos], data[startPos + 1], data[startPos + 2], data[startPos + 3]];

        if (targetColor[0] === fillColor[0] &&
            targetColor[1] === fillColor[1] &&
            targetColor[2] === fillColor[2] &&
            targetColor[3] === fillColor[3]) return;

        const stack = [[startX, startY]];

        while (stack.length > 0) {
            const [x, y] = stack.pop();
            const pos = (y * canvas.width + x) * 4;

            if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
                if (data[pos] === targetColor[0] &&
                    data[pos + 1] === targetColor[1] &&
                    data[pos + 2] === targetColor[2] &&
                    data[pos + 3] === targetColor[3]) {

                    data[pos] = fillColor[0];
                    data[pos + 1] = fillColor[1];
                    data[pos + 2] = fillColor[2];
                    data[pos + 3] = fillColor[3];

                    stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
                }
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    socket.on("drawBatch", batch => {
        batch.forEach(data => {
            localHistory.push(data); // Sin límites
            drawLine(data.fromX, data.fromY, data.toX, data.toY, data.color, data.size);
        });
    });

    socket.on("draw", data => {
        localHistory.push(data); // Sin límites
        drawLine(data.fromX, data.fromY, data.toX, data.toY, data.color, data.size);
    });

    socket.on("fill", data => {
        localHistory.push(data); // Sin límites
        floodFill(data.x, data.y, data.color);
    });

    socket.on("initHistory", history => {
        localHistory = history;
        redrawAll();
    });

    document.getElementById("clear").addEventListener("click", () => {
        socket.emit("clear");
    });

    socket.on("clear", () => {
        localHistory = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    socket.on("users", users => {
        if (users.length === 0) {
            usersDisplay.textContent = "🔴 Nadie conectado";
        } else if (users.length === 1) {
            usersDisplay.textContent = `🟢 ${users[0]} está aquí ❤️`;
        } else if (users.length === 2) {
            usersDisplay.textContent = `🟢 ${users[0]} y ${users[1]} están aquí ❤️`;
        } else {
            usersDisplay.textContent = `🟢 ${users.join(", ")} están aquí ❤️`;
        }
    });
</script>    

</body>

</html>
